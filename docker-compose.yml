services:
  # =============================================================================
  # PostgreSQL 16 - LA BASE DE GORE_OS
  # =============================================================================
  # El container goreos_db ya corre en la red visor_model_default.
  # Este servicio se define con profile "standalone" para levantarlo solo cuando
  # NO exista el container externo.
  postgres:
    profiles: ["standalone"]
    image: postgres:16-alpine
    container_name: goreos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-goreos}
      POSTGRES_USER: ${DB_USER:-goreos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_THIS}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=es_CL.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./model/model_goreos/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-goreos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visor_model_default

  # =============================================================================
  # FastAPI Backend
  # =============================================================================
  # Acceso: http://localhost:8000/api/docs
  api:
    build: ./api
    container_name: goreos_api
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME:-goreos_model}
      DB_USER: ${DB_USER:-goreos}
      DB_PASSWORD: ${DB_PASSWORD:-goreos_2026}
      DB_HOST: goreos_db
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-goreos-dev-secret-change-in-production}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visor_model_default

  # =============================================================================
  # Next.js Frontend
  # =============================================================================
  # Acceso: http://localhost:3000
  web:
    build: ./web
    container_name: goreos_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    networks:
      - visor_model_default

  # =============================================================================
  # PgAdmin 4 - Administración de Base de Datos (Desarrollo)
  # =============================================================================
  # Acceso: http://localhost:5050
  pgadmin:
    profiles: ["standalone"]
    image: dpage/pgadmin4:latest
    container_name: goreos_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@gorenuble.cl}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-CHANGE_THIS}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - visor_model_default

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pgdata:
    name: goreos_pgdata
    driver: local
  pgadmin_data:
    name: goreos_pgadmin_data
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  visor_model_default:
    external: true
    name: visor_model_default

# =============================================================================
# Uso
# =============================================================================
# Levantar API + Web (goreos_db ya debe estar corriendo en visor_model_default):
#   docker compose up -d api web
#
# Solo API:
#   docker compose up -d api
#
# Modo standalone (levanta todo incluyendo PostgreSQL):
#   docker compose --profile standalone up -d
#
# Ver logs:
#   docker compose logs -f api
#   docker compose logs -f web
#
# Detener:
#   docker compose down
#
# Rebuild:
#   docker compose build api
#   docker compose up -d api web
#
# =============================================================================
# Conexión a PostgreSQL desde host
# =============================================================================
# docker exec goreos_db psql -U goreos -d goreos_model
#
# Desde PgAdmin:
#   1. Acceder a http://localhost:5050
#   2. Agregar servidor:
#      - Host: goreos_db
#      - Port: 5432
#      - Database: goreos_model
#      - Username/Password: goreos / goreos_2026
